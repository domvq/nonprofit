<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adaptive AI Tutor</title>
<style>
:root{--bg:#f3f6fa;--fg:#14213d;--mut:#5b6678;--card:#fff;--bd:#d5dce8;--ac:#1d4ed8;--red:#c2410c;--amb:#ca8a04;--grn:#15803d;--gry:#9aa4b5}
@media(prefers-color-scheme:dark){:root{--bg:#0e1524;--fg:#e8edf7;--mut:#9aa7bd;--card:#16203a;--bd:#2a3858;--ac:#7aa2ff;--red:#fb923c;--amb:#facc15;--grn:#4ade80;--gry:#5b6678}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:.2em 0}
h1{font-size:2rem}.mut{color:var(--mut)}.err{color:var(--red);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:14px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input{flex:1;min-width:180px}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
summary{cursor:pointer;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.good{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 18%,transparent)}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fc{min-height:110px;text-align:center;padding:14px}
.fc .b,.fc.flip .f{display:none}.fc.flip .b{display:block}
.slide{border:1px solid var(--bd);border-radius:8px;padding:22px;min-height:200px}
pre{overflow:auto;background:var(--bg);padding:10px;border-radius:6px}
#map{overflow-x:auto}#map svg{min-width:520px;width:100%;height:auto}
#map g[data-id]{cursor:pointer}
.n0{fill:var(--gry)}.n1{fill:var(--red)}.n2{fill:var(--amb)}.n3{fill:var(--grn)}
.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px 0 12px;vertical-align:-1px}
</style></head><body><div class="wrap">
<h1>Adaptive AI Tutor</h1>
<p class="mut">Works with any major AI model. Your key stays in this browser and is sent only to the provider you pick.</p>

<details class="card" id="cfg" open><summary>AI model settings</summary>
<div class="cfg">
<label>Provider<br><select id="prov"></select></label>
<label>Model<br><input id="model" style="width:100%"></label>
<label>API key<br><input id="key" type="password" autocomplete="off" style="width:100%"></label>
<label>Base URL (optional)<br><input id="base" style="width:100%"></label>
</div><p class="mut" id="hint"></p></details>

<div class="card"><div class="row">
<input id="topic" aria-label="Topic" placeholder="What do you want to learn? e.g. Cardiac rhythms, Algebra II, WW2">
<select id="lvl" aria-label="Level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
<button class="pri" id="go">Build my learning path</button><button id="reset">Start over</button></div></div>

<div id="app" hidden>
<div class="card"><div class="row"><h2>Knowledge map</h2><span id="ov" class="mut"></span></div>
<p class="lg mut">Click a concept to study it.<i style="background:var(--gry)"></i>Not tested<i style="background:var(--red)"></i>Gap<i style="background:var(--amb)"></i>Developing<i style="background:var(--grn)"></i>Mastered</p>
<div id="map"></div><p id="next"></p>
<div class="row"><span class="mut">Mastery over time</span><svg id="spark" width="220" height="40" role="img" aria-label="Mastery trend"></svg></div></div>

<div class="card"><h2 id="sel"></h2><div class="row" id="tools"></div>
<div class="row" style="margin-top:8px"><input id="prob" aria-label="Problem" placeholder="Paste a problem for an expert step-by-step solution (or leave blank for a worked example)"><button id="solve">Expert solution</button></div>
<div id="out" aria-live="polite" style="margin-top:14px"></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const P={
openai:{n:'OpenAI (ChatGPT)',u:'https://api.openai.com/v1',m:'gpt-4o-mini',h:'Key from platform.openai.com.'},
anthropic:{n:'Anthropic (Claude)',m:'claude-sonnet-5-5',h:'Key from console.anthropic.com.'},
gemini:{n:'Google (Gemini)',m:'gemini-2.5-flash',h:'Free key from aistudio.google.com.'},
openrouter:{n:'OpenRouter (hundreds of models)',u:'https://openrouter.ai/api/v1',m:'openai/gpt-4o-mini',h:'One key, many models, including free ones: openrouter.ai.'},
groq:{n:'Groq (Llama and others)',u:'https://api.groq.com/openai/v1',m:'llama-3.3-70b-versatile',h:'Free tier at console.groq.com.'},
mistral:{n:'Mistral',u:'https://api.mistral.ai/v1',m:'mistral-small-latest',h:'Key from console.mistral.ai.'},
ollama:{n:'Ollama (local, free, no key)',u:'http://localhost:11434/v1',m:'llama3.2',h:'Start Ollama with OLLAMA_ORIGINS=* so the browser can connect. No key needed.'},
custom:{n:'Custom (any OpenAI-compatible API)',u:'',m:'',h:'Enter the base URL, e.g. LM Studio, vLLM, Together, DeepSeek.'}};
const fresh=()=>({cfg:{p:'openai',m:'gpt-4o-mini',k:'',u:''},topic:'',lvl:'Beginner',nodes:[],hist:[],sel:null});
let S;try{S=JSON.parse(localStorage.getItem('tutor'))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem('tutor',JSON.stringify(S))}catch(e){}};
const out=$('#out'),nd=id=>S.nodes.find(n=>n.id==id),cur=()=>nd(S.sel)||S.nodes[0];

/* ---- model layer: one ask() for every provider ---- */
async function ask(sys,user){
 const c=S.cfg,p=P[c.p];let r,j;
 try{
  if(c.p=='anthropic'){
   r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.m,max_tokens:4096,system:sys,messages:[{role:'user',content:user}]})});
   j=await r.json();if(!r.ok)throw j.error?.message||r.status;return j.content.map(x=>x.text||'').join('')}
  if(c.p=='gemini'){
   r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(c.m)+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':c.k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:user}]}]})});
   j=await r.json();if(!r.ok)throw j.error?.message||r.status;return j.candidates[0].content.parts.map(x=>x.text||'').join('')}
  const h={'content-type':'application/json'};if(c.k)h.authorization='Bearer '+c.k;
  r=await fetch((c.u||p.u).replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:h,body:JSON.stringify({model:c.m,messages:[{role:'system',content:sys},{role:'user',content:user}]})});
  j=await r.json();if(!r.ok)throw j.error?.message||r.status;return j.choices[0].message.content;
 }catch(e){throw new Error((typeof e=='string'?e:e.message||'Request failed')+'. Check your key, model name, and connection.')}
}
async function ja(sys,user){
 const t=await ask(sys+' Respond with ONLY valid JSON, no markdown fences.',user),m=t.match(/[\[{][\s\S]*[\]}]/);
 if(!m)throw new Error('The model did not return usable JSON. Try again or pick a stronger model.');
 return JSON.parse(m[0])}
const ctx=()=>`Topic: ${S.topic}. Student level: ${S.lvl}. Mastery by concept: `+S.nodes.map(n=>`${n.name} ${n.m==null?'untested':Math.round(n.m*100)+'%'}`).join('; ')+'.';
const SYS=()=>'You are a warm, precise adaptive tutor. Pitch everything at the student\'s level and give extra support on weak concepts. '+ctx();

/* ---- helpers ---- */
function md(t){return esc(t).replace(/```[\s\S]*?```/g,m=>'<pre>'+m.replace(/```\w*\n?/g,'')+'</pre>').replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/\n{2,}/g,'<br><br>')}
const busy=m=>{$('#app').hidden=false;out.innerHTML='<p class="mut">'+m+'…</p>'};
const fail=e=>{out.innerHTML='<p class="err">'+esc(e.message)+'</p>'};
async function run(msg,fn){busy(msg);try{await fn()}catch(e){fail(e)}}
const lvl=m=>m==null?0:m<.4?1:m<.7?2:3;

/* ---- build the path + diagnostic ---- */
async function build(){
 S.topic=$('#topic').value.trim();S.lvl=$('#lvl').value;
 if(!S.topic){$('#topic').focus();return}
 await run('Mapping the topic',async()=>{
  const r=await ja('You design curricula.',`Break "${S.topic}" for a ${S.lvl} learner into 6-8 core concepts with prerequisites. JSON: {"nodes":[{"id":"c1","name":"short name","pre":["ids of prerequisite concepts"]}]}. Foundations first.`);
  S.nodes=r.nodes.map(n=>({id:String(n.id),name:n.name,pre:(n.pre||[]).map(String).filter(x=>x!=n.id),m:null,d:3}));
  S.hist=[];S.sel=S.nodes[0].id;save();render();await quiz('diag')})}

/* ---- quizzes: diagnostic, adaptive concept quiz, practice test ---- */
async function quiz(mode){
 const n=cur(),all=mode!='quiz',ns=all?S.nodes:[n],count=mode=='exam'?10:mode=='diag'?S.nodes.length:5,diff=mode=='quiz'?n.d:3;
 await run(mode=='diag'?'Finding your knowledge gaps':'Writing questions',async()=>{
  const r=await ja(SYS(),`Write ${count} multiple-choice questions ${mode=='diag'?'(exactly one per concept) to find knowledge gaps':'on '+ns.map(x=>x.name).join(', ')}. Difficulty ${diff} of 5. Concept ids: ${ns.map(x=>x.id+'='+x.name).join('; ')}. JSON: {"q":[{"node":"concept id","q":"question","o":["A","B","C","D"],"a":0,"why":"one-sentence explanation"}]}`);
  play(mode,r.q,n.id)})}
function play(mode,qs,nid){
 let i=0;const res=[];
 const step=()=>{
  if(i>=qs.length)return done();
  const q=qs[i];
  out.innerHTML=`<p class="mut">Question ${i+1} of ${qs.length}</p><p><b>${esc(q.q)}</b></p>`+q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')+'<div id="fb"></div>';
  out.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k,ok=k==q.a;res.push({node:nd(q.node)?q.node:nid,ok});
   out.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j==q.a)x.classList.add('good');else if(j==k)x.classList.add('bad')});
   $('#fb').innerHTML=`<p>${ok?'Correct.':'Not quite.'} ${esc(q.why||'')}</p><button class="pri" id="nx">${i+1<qs.length?'Next question':'See results'}</button>`;
   $('#nx').onclick=()=>{i++;step()};$('#nx').focus()})};
 const done=()=>{
  const by={};res.forEach(r=>{const n=nd(r.node);if(!n)return;n.m=(n.m??.5)*.5+(r.ok?.5:0);(by[n.id]=by[n.id]||[]).push(r.ok)});
  Object.entries(by).forEach(([id,a])=>{const n=nd(id),p=a.filter(Boolean).length/a.length;n.d=Math.min(5,Math.max(1,n.d+(p>=.8?1:p<=.4?-1:0)))});
  S.hist.push({t:Date.now(),a:avg()});save();render();
  const sc=res.filter(r=>r.ok).length,nx=pickNext();
  out.innerHTML=`<h3>Score: ${sc} of ${res.length}</h3><ul>`+Object.entries(by).map(([id,a])=>`<li>${esc(nd(id).name)}: ${a.filter(Boolean).length}/${a.length}. Difficulty is now ${nd(id).d} of 5.</li>`).join('')+'</ul><p>'+(nx?`Study <b>${esc(nx.name)}</b> next.`:'You have mastered every concept on this map.')+'</p>'+(nx?'<button class="pri" id="stn">Open next concept</button>':'');
  if(nx)$('#stn').onclick=()=>{S.sel=nx.id;render();lesson()}};
 step()}

/* ---- study tools ---- */
const T={
 lesson:['Lesson',n=>`Teach "${n.name}" as a short lesson: a plain-language hook, the core idea with a worked example, one common mistake, then 2 check-your-understanding questions with answers at the end. Use markdown.`],
 guide:['Study guide',n=>`Write a study guide for "${n.name}": objectives, key terms, main ideas, a worked example, and self-test questions with answers. Use markdown.`],
 notes:['Quick notes',n=>`Write quick notes for "${n.name}": at most 12 bullets plus any key formulas or rules. Use markdown.`]};
const lesson=()=>tool('lesson');
const tool=k=>run('Writing '+T[k][0].toLowerCase(),async()=>{out.innerHTML=md(await ask(SYS(),T[k][1](cur())))});
const cards=()=>run('Making flashcards',async()=>{
 const r=await ja(SYS(),`Make 10 flashcards on "${cur().name}" within ${S.topic}. JSON: {"cards":[{"f":"front","b":"back"}]}`);
 out.innerHTML='<p class="mut">Click a card to flip it.</p><div class="grid">'+r.cards.map(c=>`<button class="fc" aria-label="Flip card"><span class="f">${esc(c.f)}</span><span class="b">${esc(c.b)}</span></button>`).join('')+'</div>';
 out.querySelectorAll('.fc').forEach(b=>b.onclick=()=>b.classList.toggle('flip'))});
const deck=()=>run('Building slides',async()=>{
 const r=await ja(SYS(),`Make a 7-slide deck teaching "${cur().name}" within ${S.topic}. JSON: {"slides":[{"t":"title","bullets":["point"],"note":"speaker note"}]}`);
 let i=0;const show=()=>{const s=r.slides[i];out.innerHTML=`<div class="slide"><h3>${esc(s.t)}</h3><ul>${(s.bullets||[]).map(b=>'<li>'+esc(b)+'</li>').join('')}</ul><p class="mut">${esc(s.note||'')}</p></div><div class="row" style="margin-top:8px"><button id="pv">Previous</button><span class="mut">${i+1} / ${r.slides.length}</span><button id="nxs">Next</button></div>`;
  $('#pv').onclick=()=>{i=Math.max(0,i-1);show()};$('#nxs').onclick=()=>{i=Math.min(r.slides.length-1,i+1);show()}};show()});
const solve=()=>run('Solving',async()=>{
 const p=$('#prob').value.trim()||`Create a challenging problem on ${cur().name}, then solve it.`;
 out.innerHTML=md(await ask(SYS(),`Give an expert solution, step by step, explaining the reasoning behind each step, then the final answer and a tip to avoid the usual error. Problem: ${p}`))});

/* ---- knowledge map ---- */
const avg=()=>S.nodes.length?S.nodes.reduce((a,n)=>a+(n.m||0),0)/S.nodes.length:0;
function pickNext(){
 const ok=n=>n.pre.every(p=>!nd(p)||(nd(p).m??0)>=.5),w=n=>n.m??.5,l=S.nodes.filter(n=>w(n)<.7).sort((a,b)=>w(a)-w(b));
 return l.find(ok)||l[0]}
function render(){
 if(!S.nodes.length)return;
 $('#app').hidden=false;
 const dp={},D=n=>dp[n.id]??(dp[n.id]=0,dp[n.id]=1+Math.max(-1,...n.pre.map(p=>nd(p)?D(nd(p)):-1)));
 const cols=[];S.nodes.forEach(n=>(cols[D(n)]=cols[D(n)]||[]).push(n));
 const rows=Math.max(...cols.filter(Boolean).map(c=>c.length)),W=cols.length*150+20,H=rows*84+30,pos={};
 cols.forEach((c,x)=>c&&c.forEach((n,y)=>pos[n.id]=[70+x*150,(H-c.length*84)/2+y*84+42]));
 const nx=pickNext();let s=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Knowledge map">`;
 S.nodes.forEach(n=>n.pre.forEach(p=>{if(pos[p])s+=`<line x1="${pos[p][0]}" y1="${pos[p][1]}" x2="${pos[n.id][0]}" y2="${pos[n.id][1]}" stroke="var(--bd)" stroke-width="2"/>`}));
 S.nodes.forEach(n=>{const[x,y]=pos[n.id],sel=n.id==S.sel,isN=nx&&nx.id==n.id;
  s+=`<g data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}, ${n.m==null?'not tested':Math.round(n.m*100)+'% mastery'}${isN?', study next':''}">`+
  (isN?`<circle cx="${x}" cy="${y}" r="31" fill="none" stroke="var(--ac)" stroke-width="3" stroke-dasharray="5 4"/>`:'')+
  `<circle class="n${lvl(n.m)}" cx="${x}" cy="${y}" r="24" stroke="${sel?'var(--fg)':'none'}" stroke-width="3"/>`+
  `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${n.m==null?'?':Math.round(n.m*100)}</text>`+
  `<text x="${x}" y="${y+48}" text-anchor="middle" font-size="12" fill="var(--fg)">${esc(n.name.length>19?n.name.slice(0,18)+'…':n.name)}</text></g>`});
 $('#map').innerHTML=s+'</svg>';
 $('#map').querySelectorAll('[data-id]').forEach(g=>{const f=()=>{S.sel=g.dataset.id;save();render()};g.onclick=f;g.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();f()}}});
 $('#next').innerHTML=nx?`Study next: <b>${esc(nx.name)}</b> (dashed ring).`:'Every concept is mastered. Take a practice test to lock it in.';
 $('#ov').textContent='Overall mastery '+Math.round(avg()*100)+'%';
 const h=S.hist.map(x=>x.a);
 $('#spark').innerHTML=h.length>1?`<polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${h.map((v,i)=>(6+i*(208/(h.length-1)))+','+(34-v*28)).join(' ')}"/>`:'<text x="0" y="24" font-size="12" fill="var(--mut)">Take 2+ quizzes to see a trend</text>';
 const n=cur();$('#sel').textContent=n.name+(n.m==null?'':' · '+Math.round(n.m*100)+'% mastery · difficulty '+n.d+' of 5');
 $('#tools').innerHTML='<button data-t="lesson" class="pri">Lesson</button><button data-t="quiz">Adaptive quiz</button><button data-t="cards">Flashcards</button><button data-t="exam">Practice test</button><button data-t="deck">Slide deck</button><button data-t="guide">Study guide</button><button data-t="notes">Quick notes</button>';
 $('#tools').querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=b.dataset.t;({lesson,cards,deck}[t]||(t=='quiz'||t=='exam'?()=>quiz(t):()=>tool(t)))()})}

/* ---- settings ---- */
$('#prov').innerHTML=Object.entries(P).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
function cfgUI(){const c=S.cfg,p=P[c.p];$('#prov').value=c.p;$('#model').value=c.m;$('#key').value=c.k;$('#base').value=c.u;$('#base').placeholder=p.u||'https://…/v1';$('#hint').textContent=p.h}
$('#prov').onchange=e=>{S.cfg.p=e.target.value;S.cfg.m=P[S.cfg.p].m;S.cfg.u='';save();cfgUI()};
[['model','m'],['key','k'],['base','u']].forEach(([id,k])=>$('#'+id).oninput=e=>{S.cfg[k]=e.target.value.trim();save()});
$('#go').onclick=build;$('#solve').onclick=solve;
$('#reset').onclick=()=>{if(confirm('Erase your learning path and progress?')){S=Object.assign(fresh(),{cfg:S.cfg});save();$('#app').hidden=true;$('#topic').value='';out.innerHTML=''}};
cfgUI();$('#topic').value=S.topic||new URLSearchParams(location.search).get('topic')||'';$('#lvl').value=S.lvl;render();
</script></body></html>
