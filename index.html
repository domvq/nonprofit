<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMS AI &amp; Medical Research Initiative</title>

<meta name="description" content="Advancing emergency medicine and healthcare through artificial intelligence research, education, scientific evaluation, and responsible innovation.">
<meta name="theme-color" content="#211D17">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   DESIGN SYSTEM
   ========================================================= */

:root{
  --paper:#FFFFFF;
  --tint:#FDF6EC;
  --ink:#211D17;
  --ink-soft:#6B6459;

  --accent:#E2811E;
  --accent-deep:#B9650F;

  --rescue:#C1443B;

  --line:#ECE3D2;
  --line-soft:#F3ECDD;

  --sans:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif;

  --max:1100px;
  --radius:12px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

img{
  max-width:100%;
  display:block;
}

a{
  color:var(--accent-deep);
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
}

h1,h2,h3,h4{
  margin:0 0 .5em;
  color:var(--ink);
  font-family:var(--sans);
  font-weight:800;
  line-height:1.15;
  letter-spacing:-.02em;
}

h1{
  font-size:clamp(2.25rem,5vw,3.4rem);
}

h2{
  font-size:clamp(1.65rem,3vw,2.25rem);
}

h3{
  font-size:1.15rem;
}

p{
  max-width:40em;
  margin:0 0 1.1em;
}

.lede{
  color:var(--ink-soft);
  font-size:1.1rem;
  max-width:36em;
}

.wrap{
  max-width:var(--max);
  margin:0 auto;
  padding:0 28px;
}

.small{
  color:var(--ink-soft);
  font-size:.88rem;
}

.center{
  text-align:center;
}

@media(prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  *{
    animation:none!important;
    transition:none!important;
  }
}


/* =========================================================
   SKIP LINK
   ========================================================= */

.skip-link{
  position:absolute;
  left:-999px;
  top:0;
  z-index:500;
  padding:10px 16px;
  background:var(--accent);
  color:#fff;
  border-radius:0 0 8px 0;
}

.skip-link:focus{
  left:0;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
  padding:8px 0;
  background:var(--tint);
  color:var(--ink-soft);
  border-bottom:1px solid var(--line);
  font-size:.82rem;
}

.topbar .wrap{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}

.topbar a{
  color:var(--accent-deep);
  font-weight:700;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.site-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}

.nav-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:15px 0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
  font-size:1.05rem;
  font-weight:800;
}

.brand:hover{
  text-decoration:none;
}

.brand .mark{
  width:34px;
  height:34px;
  flex:none;
}

.brand .name em{
  display:block;
  margin-top:1px;
  color:var(--ink-soft);
  font-size:.58em;
  font-style:normal;
  font-weight:600;
  letter-spacing:.01em;
}

.primary ul{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:3px;
  margin:0;
  padding:0;
  list-style:none;
}

.primary a{
  display:inline-block;
  padding:8px 12px;
  border-radius:999px;
  color:var(--ink);
  font-size:.9rem;
  font-weight:600;
}

.primary a:hover{
  background:var(--tint);
  text-decoration:none;
}

.primary a[aria-current="page"]{
  background:var(--ink);
  color:#fff;
}

.nav-toggle{
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--ink);
  cursor:pointer;
  font-family:var(--sans);
  font-size:.9rem;
  font-weight:700;
}

@media(max-width:900px){

  .nav-toggle{
    display:inline-flex;
  }

  .primary{
    display:none;
    width:100%;
    order:3;
  }

  .primary.open{
    display:block;
  }

  .primary ul{
    flex-direction:column;
    align-items:stretch;
    padding:10px 0 14px;
  }

  .primary a{
    display:block;
  }

  .nav-row{
    flex-wrap:wrap;
  }
}


/* =========================================================
   BUTTONS
   ========================================================= */

.btn{
  display:inline-block;
  padding:13px 23px;
  border:2px solid transparent;
  border-radius:999px;
  font-family:var(--sans);
  font-size:.94rem;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{
  text-decoration:none;
}

.btn-primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.btn-primary:hover{
  background:var(--accent-deep);
  border-color:var(--accent-deep);
}

.btn-outline{
  background:transparent;
  border-color:var(--line);
  color:var(--ink);
}

.btn-outline:hover{
  background:var(--tint);
}

.btn-dark{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}

.btn-dark:hover{
  background:#3a332b;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
  overflow:hidden;
  padding:72px 0 35px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  align-items:center;
  gap:54px;
}

.eyebrow{
  display:inline-block;
  margin-bottom:14px;
  color:var(--accent-deep);
  font-size:.84rem;
  font-weight:800;
  letter-spacing:.02em;
  text-transform:uppercase;
}

.hero h1{
  max-width:760px;
}

.hero-actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:25px;
}

.hero-note{
  margin-top:16px;
  color:var(--ink-soft);
  font-size:.82rem;
}

.hero-art{
  position:relative;
}

.hero-art svg{
  width:100%;
  height:auto;
  border-radius:var(--radius);
}

@media(max-width:880px){

  .hero{
    padding-top:45px;
  }

  .hero-grid{
    grid-template-columns:1fr;
  }

  .hero-art{
    order:-1;
  }
}


/* =========================================================
   STATS
   ========================================================= */

.stat-strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
  padding:30px 0 12px;
}

.stat .num{
  display:block;
  margin-bottom:2px;
  color:var(--accent);
  font-size:1.9rem;
  font-weight:800;
}

.stat .label{
  color:var(--ink-soft);
  font-size:.84rem;
}

@media(max-width:700px){

  .stat-strip{
    grid-template-columns:repeat(2,1fr);
  }
}


/* =========================================================
   SECTIONS
   ========================================================= */

section{
  padding:65px 0;
}

section.tinted{
  background:var(--tint);
}

.section-head{
  max-width:720px;
  margin-bottom:38px;
}

.tab-label{
  display:inline-block;
  margin-bottom:10px;
  color:var(--accent-deep);
  font-size:.82rem;
  font-weight:800;
  letter-spacing:.02em;
  text-transform:uppercase;
}


/* =========================================================
   ABOUT / MISSION
   ========================================================= */

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  align-items:start;
}

.mission-statement{
  padding:28px;
  background:#fff;
  border-left:4px solid var(--accent);
  border-radius:var(--radius);
  box-shadow:0 8px 30px rgba(33,29,23,.04);
}

.mission-statement p{
  margin:0;
  color:var(--ink);
  font-size:1.08rem;
  font-weight:600;
}

@media(max-width:800px){

  .about-grid{
    grid-template-columns:1fr;
    gap:35px;
  }
}


/* =========================================================
   VALUES / FOCUS AREAS
   ========================================================= */

.grid{
  display:grid;
  gap:30px;
}

.grid-3{
  grid-template-columns:repeat(3,1fr);
}

.grid-4{
  grid-template-columns:repeat(4,1fr);
}

.card{
  padding:18px 0 0;
  background:transparent;
  border-top:2px solid var(--ink);
}

.card.accent{
  border-top-color:var(--accent);
}

.card .meta{
  display:block;
  margin-bottom:8px;
  color:var(--accent-deep);
  font-size:.78rem;
  font-weight:800;
}

.card h3{
  margin-bottom:.4em;
}

@media(max-width:900px){

  .grid-3,
  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:620px){

  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }
}


/* =========================================================
   AUDIENCE
   ========================================================= */

.audience{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
}

.audience-item{
  padding-top:18px;
  border-top:2px solid var(--ink);
}

.audience-item strong{
  display:block;
  margin-bottom:5px;
  font-size:1.2rem;
}

.audience-item span{
  color:var(--ink-soft);
  font-size:.86rem;
}

@media(max-width:850px){

  .audience{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .audience{
    grid-template-columns:1fr;
  }
}


/* =========================================================
   TOOLS
   ========================================================= */

.tool-card{
  display:flex;
  flex-direction:column;
  gap:9px;
  height:100%;
  padding:27px;
  background:var(--tint);
  border-radius:var(--radius);
}

.tool-kicker{
  color:var(--accent-deep);
  font-size:.76rem;
  font-weight:800;
  text-transform:uppercase;
}

.tool-card h3{
  margin-bottom:0;
}

.tool-link{
  margin-top:auto;
  padding-top:10px;
  color:var(--accent-deep);
  font-weight:800;
}


/* =========================================================
   RESEARCH SECTION
   ========================================================= */

.research-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.research-list{
  display:grid;
  gap:15px;
  margin-top:25px;
}

.research-list div{
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.research-list strong{
  display:block;
  margin-bottom:3px;
}

.research-list span{
  color:var(--ink-soft);
  font-size:.9rem;
}

.research-panel{
  padding:35px;
  background:var(--ink);
  color:#fff;
  border-radius:var(--radius);
}

.research-panel h2,
.research-panel h3{
  color:#fff;
}

.research-panel p{
  color:#DED7CD;
}

.research-panel .accent-text{
  color:#F3A34C;
}

@media(max-width:800px){

  .research-grid{
    grid-template-columns:1fr;
  }
}


/* =========================================================
   DISCLAIMER
   ========================================================= */

.disclaimer{
  padding:22px 0;
  background:#fff;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.disclaimer p{
  margin:0;
  color:var(--ink-soft);
  font-size:.82rem;
}


/* =========================================================
   CTA
   ========================================================= */

.cta{
  padding:65px 0;
}

.cta-box{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:35px;
  padding:38px;
  background:var(--tint);
  border-radius:var(--radius);
}

.cta-box h2{
  margin-bottom:10px;
}

.cta-box p{
  margin:0;
  color:var(--ink-soft);
}

@media(max-width:700px){

  .cta-box{
    grid-template-columns:1fr;
  }
}


/* =========================================================
   FOOTER
   ========================================================= */

.site-footer{
  margin-top:0;
  padding:50px 0 25px;
  background:
